name: Compila la mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file
        uses: actions/checkout@v4

      - name: Installa Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.4.2

      - name: Compila la mod
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log

      - name: Salva il file .jar
        uses: actions/upload-artifact@v4
        with:
          name: bizarre-mod-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Salva il log (utile se qualcosa va storto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: build.log
